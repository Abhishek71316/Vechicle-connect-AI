<!DOCTYPE html>
<html>
<head>
    <title>Vehicle GPS Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background: #111;
            color: #fff;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #60a5fa;
            font-weight: bold;
        }

        #serverStatus {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }

        .data {
            margin-top: 20px;
            padding: 20px;
            background: #222;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .data p {
            font-size: 16px;
            margin: 10px 0;
        }

        span {
            font-family: monospace;
            font-weight: bold;
            color: #4ade80;
        }

        .server-config {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }

        input[type="text"] {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            width: 80%;
            max-width: 300px;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<h1>🚗 Real-Time Vehicle Tracking</h1>

<button onclick="startGPS()">
    Start GPS Tracking
</button>

<div id="status">
    GPS not started
</div>

<div id="serverStatus">
    Server Status: Waiting for GPS...
</div>

<div class="data">
    <p>Latitude: <span id="latitude">---</span></p>
    <p>Longitude: <span id="longitude">---</span></p>
    <p>Accuracy: <span id="accuracy">---</span> m</p>
</div>

<div class="server-config">
    <label>Server Endpoint Target:</label><br>
    <input type="text" id="serverUrl" value="" placeholder="http://localhost:3000">
</div>

<script>

let watchID = null;

// Determine default server URL dynamically
function getServerBaseUrl() {
    if (window.location.protocol === "file:") {
        return "http://localhost:5000";
    }
    return window.location.origin;
}

// Pre-fill server URL input on DOM load
document.addEventListener("DOMContentLoaded", () => {
    const defaultUrl = getServerBaseUrl();
    const input = document.getElementById("serverUrl");
    if (input) {
        input.value = defaultUrl;
    }
});

function startGPS() {

    if (!navigator.geolocation) {
        document.getElementById("status").innerText =
            "GPS is not supported by this browser.";
        return;
    }

    document.getElementById("status").innerText =
        "Getting GPS location...";

    watchID = navigator.geolocation.watchPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;

            console.log("Latitude:", latitude);
            console.log("Longitude:", longitude);

            document.getElementById("latitude").innerText =
                latitude;

            document.getElementById("longitude").innerText =
                longitude;

            document.getElementById("accuracy").innerText =
                accuracy.toFixed(2);

            document.getElementById("status").innerText =
                "🟢 GPS tracking active";


            // Send GPS data to backend server
            sendGPSData(
                latitude,
                longitude,
                accuracy
            );
        },

        function(error) {

            console.error(error);

            document.getElementById("status").innerText =
                "❌ GPS Error: " + error.message;
        },

        {
            enableHighAccuracy: true,
            maximumAge: 2000,
            timeout: 10000
        }
    );
}


async function sendGPSData(
    latitude,
    longitude,
    accuracy
) {
    const inputVal = document.getElementById("serverUrl") ? document.getElementById("serverUrl").value.trim() : "";
    const baseUrl = inputVal ? inputVal.replace(/\/$/, "") : getServerBaseUrl();
    const targetUrl = baseUrl + "/api/location";

    try {

        const response = await fetch(
            targetUrl,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    latitude: latitude,

                    longitude: longitude,

                    accuracy: accuracy,

                    timestamp: Date.now()
                })
            }
        );

        if (!response.ok) {
            throw new Error(`HTTP Error ${response.status}`);
        }

        const result = await response.json();

        console.log(
            "GPS server response:",
            result
        );

        document.getElementById("serverStatus").innerHTML =
            `<span style="color:#4ade80;">🟢 Server Received (${new Date().toLocaleTimeString()})</span>`;

    }

    catch (error) {

        console.error(
            "Failed to send GPS:",
            error
        );

        document.getElementById("serverStatus").innerHTML =
            `<span style="color:#f87171;">🔴 Server Error: ${error.message} (Target: ${targetUrl})</span>`;

    }
}

</script>

</body>
</html>
